<!doctype html>
<html lang="es">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Abrir WhatsApp · CRM local</title></head>
  <body>
    <p>Abriendo WhatsApp con el mensaje preparado. El mensaje todavía debe enviarse manualmente.</p>
    <p><a id="whatsapp-link" href="{{ whatsapp_url }}" rel="noopener">Si no se abre, tocá acá para abrir WhatsApp</a></p>
    {{ whatsapp_url|json_script:"whatsapp-url" }}
    <script>
      const whatsappUrl = JSON.parse(document.getElementById("whatsapp-url").textContent);
      if (window.opener && !window.opener.closed) window.opener.location.reload();
      window.location.replace(whatsappUrl);
    </script>
  </body>
</html>
