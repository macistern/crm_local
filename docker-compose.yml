services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-this-key}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-crm_local}
      POSTGRES_USER: ${POSTGRES_USER:-crm_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_local_local}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      INITIAL_USERS_PASSWORD: ${INITIAL_USERS_PASSWORD:?Configurá INITIAL_USERS_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_local}
      POSTGRES_USER: ${POSTGRES_USER:-crm_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_local_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_local} -d ${POSTGRES_DB:-crm_local}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
